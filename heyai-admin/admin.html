<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ruang Admin — heyaipeople.site</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--line:#e4e4e0;--ink:#16161a;--mute:#6b6b73;--acc:#ff4d1c;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.lcard h1{font-size:20px;margin:4px 0 6px}.lcard p{color:var(--mute);font-size:13px;margin-bottom:18px}
.tag{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--acc);letter-spacing:.06em}
/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;padding:4px 8px 14px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;color:#34343a;font-weight:500}
.nav button:hover{background:#f1f1ee}.nav button.on{background:var(--ink);color:#fff}
.nav .n{font-size:11px;background:#eee;color:#444;border-radius:99px;padding:1px 7px}.nav .on .n{background:#ffffff30;color:#fff}
.side .foot{margin-top:18px;padding:10px;font-size:12px;color:var(--mute)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h2{font-size:16px}.state{font-size:12px;color:var(--mute)}.state.dirty{color:var(--warn);font-weight:600}
.page{padding:22px;max-width:1080px}
.btn.mbtn{display:none}
/* ui */
.btn{display:inline-flex;gap:6px;align-items:center;padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#bbb}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.bad{color:var(--bad);border-color:#f3c9c9;background:#fff6f6}.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.f input[type=text],.f input[type=number],.f input[type=password],.f textarea,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.f textarea{min-height:74px;resize:vertical}.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid #16161a22;border-color:#16161a}
.f .hint{font-size:11.5px;color:var(--mute);margin-top:3px}
.chk{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;cursor:pointer}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat .l{font-size:12px;color:var(--mute)}.stat .v{font-size:26px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}.bars i{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.chk-item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #f0f0ec}.chk-item:last-child{border:0}
.b{font:700 10px/1 ui-monospace,monospace;padding:3px 6px;border-radius:5px;height:max-content;margin-top:3px}
.b.w{background:#fef3c7;color:var(--warn)}.b.o{background:#dcfce7;color:var(--ok)}.b.x{background:#fee2e2;color:var(--bad)}
.item{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:10px;overflow:hidden}
.item.off{opacity:.6}
.ihead{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.ihead .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ihead .m{font-size:12px;color:var(--mute)}
.thumb{width:44px;height:44px;border-radius:8px;background:#eee center/cover;flex:none;border:1px solid var(--line)}
.ibody{padding:12px;border-top:1px solid var(--line);display:none;background:#fcfcfb}.item.open .ibody{display:block}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eee}.pill.free{background:#dcfce7;color:var(--ok)}.pill.off{background:#e5e7eb;color:#555}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mi{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;font-size:11px}.mi .pv{aspect-ratio:1;background:#eee center/cover;display:grid;place-items:center;font-weight:700;color:#777}
.mi .in{padding:6px}.mi .in div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.up{display:flex;gap:8px;align-items:center}.up input[type=text]{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:90vw}
.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:16px}.mbox{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:16px}
@media(max-width:820px){
 .shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}.side.open{transform:none;box-shadow:0 0 40px #0004}
 .btn.mbtn{display:inline-flex}.page{padding:14px}.g2,.g3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{padding:10px 12px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <form class="lcard" id="lform">
    <div class="tag">HEYAIPEOPLE · RUANG ADMIN</div>
    <h1>Masuk</h1>
    <p>Kelola katalog, harga, foto, dan teks halaman heyaipeople.site dari sini.</p>
    <div class="f"><label>Password</label><input type="password" id="lpw" autocomplete="current-password" required></div>
    <button class="btn dark" style="width:100%;justify-content:center">Masuk</button>
    <div id="lerr" style="color:var(--bad);font-size:12.5px;margin-top:8px"></div>
  </form>
</div>

<div class="shell hide" id="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="dot"></span>heyaipeople</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Perubahan baru tampil di situs setelah menekan <b>Simpan &amp; terbitkan</b>.</div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="row"><button class="btn mbtn" id="menuBtn">☰</button><h2 id="ptitle"></h2></div>
      <div class="row"><span class="state" id="state">Tersimpan</span>
        <a class="btn" href="/" target="_blank" rel="noopener">Lihat situs ↗</a>
        <button class="btn pri" id="saveBtn">Simpan &amp; terbitkan</button></div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="toast hide" id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const TK='hey_admin_token';
let S=null, SCHEMA=null, TAB='ringkasan', dirty=false, openItems=new Set(), STATS=null, MEDIA=null;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const tok=()=>localStorage.getItem(TK)||'';

function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');setTimeout(()=>t.classList.add('hide'),3600)}
async function api(path,opt={}){
  const h=Object.assign({Authorization:'Bearer '+tok()},opt.headers||{});
  const r=await fetch('/hey-api/'+path,Object.assign({},opt,{headers:h}));
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&path!=='login'){localStorage.removeItem(TK);location.reload();throw new Error('sesi')}
  if(!r.ok)throw new Error(j.error||('Gagal ('+r.status+')'));
  return j;
}
function setDirty(v){dirty=v;const s=$('#state');s.textContent=v?'Ada perubahan belum diterbitkan':'Tersimpan';s.className='state'+(v?' dirty':'')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- login ---------- */
$('#lform').addEventListener('submit',async e=>{e.preventDefault();
  try{const j=await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#lpw').value})});localStorage.setItem(TK,j.token);boot()}
  catch(err){$('#lerr').textContent=err.message}});

async function boot(){
  if(!tok())return;
  try{const j=await api('store');S=j.store;SCHEMA=j.schema;window.__firstPw=j.firstPw}catch{return}
  $('#login').classList.add('hide');$('#shell').classList.remove('hide');
  render();api('stats').then(x=>{STATS=x;if(TAB==='ringkasan')render()}).catch(()=>{});
}

/* ---------- nav ---------- */
const TABS=[['ringkasan','Ringkasan'],['photos','Prompt Foto',()=>S.photos.length],['sbs','Storyboard → Video',()=>S.sbs.length],['bundles','Paket Bundling',()=>S.bundles.length],['teks','Teks Halaman'],['set','Pengaturan'],['media','Foto & Video'],['riwayat','Riwayat'],['aman','Keamanan']];
function renderNav(){$('#nav').innerHTML=TABS.map(([k,l,n])=>`<button data-tab="${k}" class="${TAB===k?'on':''}"><span>${l}</span>${n?`<span class="n">${n()}</span>`:''}</button>`).join('');
  $('#ptitle').textContent=(TABS.find(t=>t[0]===TAB)||[])[1]||''}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.tab;$('#side').classList.remove('open');render();scrollTo(0,0)});
$('#menuBtn').addEventListener('click',()=>$('#side').classList.toggle('open'));

/* ---------- path binding ---------- */
function setPath(path,val){if(path.startsWith('t.')){S.t[path.slice(2)]=val;setDirty(true);return}const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;setDirty(true)}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.p)return;
  let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num!==undefined)v=Number(v)||0;
  if(el.dataset.lines!==undefined)v=String(v).split('\n').map(x=>x.trim()).filter(Boolean);
  setPath(el.dataset.p,v);
  if(el.dataset.live){const t=el.closest('.item');if(t){const h=t.querySelector('.t');if(h&&el.dataset.live==='title')h.textContent=v||'Tanpa judul'}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.rerender){render()}});

/* ---------- upload ---------- */
async function uploadTo(file,path,cb){
  if(!file)return;toast('Mengunggah '+file.name+' …');
  try{const j=await api('upload?name='+encodeURIComponent(file.name),{method:'POST',body:file});
    if(path)setPath(path,j.url);toast('Terunggah: '+j.url);MEDIA=null;if(cb)cb(j.url);else render()}
  catch(err){toast(err.message,true)}
}
function upField(path,label,accept,hint){
  const val=path.split('.').reduce((o,k)=>o[k],S)||'';
  const isImg=/\.(jpe?g|png|webp)$/i.test(val);
  return `<div class="f"><label>${label}</label>
   <div class="up"><input type="text" data-p="${path}" value="${esc(val)}" placeholder="uploads/… atau https://…">
   <label class="btn sm" style="margin:0;cursor:pointer">Unggah<input type="file" hidden accept="${accept}" onchange="uploadTo(this.files[0],'${path}')"></label>
   <button type="button" class="btn sm" onclick="pickMedia('${path}','${accept}')">Pilih</button>
   ${val?`<button type="button" class="btn sm bad" onclick="setPath('${path}','');render()">×</button>`:''}</div>
   ${isImg?`<img src="/${esc(val)}" alt="" style="margin-top:6px;max-height:90px;border-radius:8px;border:1px solid var(--line)">`:''}
   ${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
async function pickMedia(path,accept){
  try{const j=await api('media');
   const vid=/video/.test(accept)&&!/image/.test(accept);
   const list=j.list.filter(m=>vid?/\.(mp4|webm)$/.test(m.url):(/image/.test(accept)?/\.(jpe?g|png|webp)$/.test(m.url):true));
   const h=document.createElement('div');h.className='modal';
   h.innerHTML=`<div class="mbox"><div class="row between" style="margin-bottom:10px"><b>Pilih dari Foto &amp; Video terunggah</b><button class="btn sm" id="mc">Tutup</button></div>${list.length?`<div class="media">${list.map(m=>`<div class="mi" style="cursor:pointer" data-u="${esc(m.url)}"><div class="pv" style="${/\.(mp4|webm)$/.test(m.url)?'':`background-image:url('/${esc(m.url)}')`}">${/\.(mp4|webm)$/.test(m.url)?'VIDEO':''}</div><div class="in"><div>${esc(m.url.slice(8))}</div></div></div>`).join('')}</div>`:'<p style="color:var(--mute)">Belum ada file. Pakai tombol Unggah.</p>'}</div>`;
   document.body.appendChild(h);
   h.addEventListener('click',e=>{if(e.target===h||e.target.id==='mc')h.remove();const c=e.target.closest('.mi');if(c){setPath(path,c.dataset.u);h.remove();render()}});
  }catch(err){toast(err.message,true)}
}

/* ---------- ringkasan ---------- */
function checks(){
  const out=[];const P=S.photos,B=S.sbs;const vis=x=>!x.hidden;
  const free=P.concat(B).filter(x=>x.free&&vis(x));
  if(free.length===0)out.push(['w','Belum ada sampel gratis. Tombol "Contoh Terbuka" di situs akan tersembunyi.']);
  else if(free.length>1)out.push(['w',`${free.length} produk ditandai sampel gratis (${free.map(x=>x.title).join(', ')}). Pastikan memang sengaja: prompt-nya terbuka untuk siapa saja.`]);
  else out.push(['o',`Sampel gratis: 1 produk (${free[0].title}). Prompt lainnya terkunci dan tidak ada di sumber halaman.`]);
  const noImg=P.filter(p=>vis(p)&&!p.imageUrl);
  if(noImg.length)out.push(['w',`${noImg.length} Prompt Foto belum punya foto hasil asli, jadi di situs tampil sebagai "ILUSTRASI CONTOH": ${noImg.map(p=>p.title).join(', ')}.`]);
  else if(P.length)out.push(['o','Semua Prompt Foto sudah punya foto hasil.']);
  const noVid=B.filter(p=>vis(p)&&!p.videoUrl);
  if(noVid.length)out.push(['w',`${noVid.length} Storyboard belum punya video asli, jadi di situs tampil animasi ilustrasi: ${noVid.map(p=>p.title).join(', ')}.`]);
  const empty=P.concat(B).filter(x=>vis(x)&&!(x.prompt||x.promptImage||x.promptVideo));
  if(empty.length)out.push(['x',`Prompt kosong: ${empty.map(x=>x.title).join(', ')}. Pembeli tidak akan menerima isi apa pun.`]);
  const vp=P.filter(vis),vb=B.filter(vis);
  const sums={photos:vp.reduce((a,x)=>a+x.price,0),storyboards:vb.reduce((a,x)=>a+x.price,0)};sums.all=sums.photos+sums.storyboards;
  S.bundles.filter(vis).forEach(b=>{const base=b.originalPrice>0?b.originalPrice:sums[b.scope];
    if(b.price>=base)out.push(['x',`Paket "${b.title}" (${rp(b.price)}) tidak lebih murah dari harga satuannya (${rp(base)}). Label hemat tidak akan tampil.`]);
    else out.push(['o',`Paket "${b.title}": satuan ${rp(base)} → paket ${rp(b.price)} (hemat ${Math.round((1-b.price/base)*100)}%, dihitung otomatis).`])});
  if(!S.s.annOn)out.push(['w','Bar informasi di atas situs dimatikan.']);
  if(window.__firstPw)out.push(['x','Password awal masih dipakai. Ganti di menu Keamanan.']);
  const hid=P.concat(B).filter(x=>x.hidden).length;if(hid)out.push(['w',`${hid} produk disembunyikan dari pembeli.`]);
  return out;
}
function viewRingkasan(){
  const d=STATS?STATS.days:[];const t=d[d.length-1]||{pageview:0,add_to_cart:0,wa_click:0};
  const sum=k=>d.reduce((a,x)=>a+(x[k]||0),0);const mx=Math.max(1,...d.map(x=>x.pageview));
  return `<div class="stats">
   <div class="stat"><div class="l">Tayangan hari ini</div><div class="v">${t.pageview}</div></div>
   <div class="stat"><div class="l">Tayangan 14 hari</div><div class="v">${sum('pageview')}</div></div>
   <div class="stat"><div class="l">Masuk keranjang (14 hari)</div><div class="v">${sum('add_to_cart')}</div></div>
   <div class="stat"><div class="l">Klik Pesan WhatsApp (14 hari)</div><div class="v">${sum('wa_click')}</div></div></div>
   <div class="card"><h3>Tayangan per hari (14 hari)</h3><div class="bars">${d.map(x=>`<i title="${x.d}: ${x.pageview}" style="height:${Math.max(2,x.pageview/mx*100)}%"></i>`).join('')}</div>
   <div class="hint" style="font-size:12px;color:var(--mute);margin-top:8px">${STATS&&STATS.since?`Penghitung aktif sejak ${STATS.since}. `:'Penghitung baru mulai dipasang; angka akan terisi seiring pengunjung. '}Tayangan memuat semua kunjungan, termasuk robot mesin pencari. "Klik Pesan WhatsApp" = tombol ditekan, bukan jaminan pembelian.</div></div>
   <div class="card"><h3>Cek kesiapan toko</h3>${checks().map(([k,m])=>`<div class="chk-item"><span class="b ${k}">${k==='o'?'OK':k==='w'?'CEK':'PERBAIKI'}</span><span>${esc(m)}</span></div>`).join('')}</div>`;
}

/* ---------- daftar produk ---------- */
function move(arr,i,d){const j=i+d;if(j<0||j>=S[arr].length)return;[S[arr][i],S[arr][j]]=[S[arr][j],S[arr][i]];setDirty(true);render()}
function del(arr,i){if(!confirm('Hapus "'+S[arr][i].title+'" dari katalog? (Bisa dipulihkan dari menu Riwayat sebelum disimpan lagi)'))return;S[arr].splice(i,1);setDirty(true);render()}
function dup(arr,i){const c=JSON.parse(JSON.stringify(S[arr][i]));c.id='';c.title+=' (salinan)';c.free=false;S[arr].splice(i+1,0,c);setDirty(true);render()}
function toggleOpen(k){openItems.has(k)?openItems.delete(k):openItems.add(k);render(true)}
function head(arr,i,x,thumb,meta){
  const k=arr+i;
  return `<div class="ihead" onclick="toggleOpen('${k}')"><div class="thumb" style="${thumb?`background-image:url('/${esc(thumb)}')`:''}"></div>
  <div style="min-width:0;flex:1"><div class="t">${esc(x.title)||'Tanpa judul'}</div><div class="m">${esc(meta)} · ${rp(x.price)}</div></div>
  ${x.free?'<span class="pill free">GRATIS</span>':''}${x.hidden?'<span class="pill off">DISEMBUNYIKAN</span>':''}<span>${openItems.has(k)?'▲':'▼'}</span></div>`;
}
function actions(arr,i){return `<div class="row" style="margin:6px 0 2px"><button class="btn sm" onclick="move('${arr}',${i},-1)">↑ Naik</button><button class="btn sm" onclick="move('${arr}',${i},1)">↓ Turun</button><button class="btn sm" onclick="dup('${arr}',${i})">Gandakan</button><button class="btn sm bad" onclick="del('${arr}',${i})">Hapus</button></div>`}
function viewPhotos(){
  return `<div class="row between" style="margin-bottom:12px"><div style="color:var(--mute);max-width:620px">Centang <b>Sampel gratis</b> pada produk yang boleh dilihat penuh oleh siapa pun. Prompt produk lain tidak pernah dikirim ke browser pengunjung.</div><button class="btn dark" onclick="addPhoto()">+ Tambah prompt foto</button></div>`+
  S.photos.map((p,i)=>`<div class="item ${p.hidden?'off':''} ${openItems.has('photos'+i)?'open':''}">${head('photos',i,p,p.imageUrl,p.category||'tanpa kategori')}
   <div class="ibody"><div class="g3"><div class="f"><label>Judul</label><input type="text" data-p="photos.${i}.title" data-live="title" value="${esc(p.title)}"></div>
   <div class="f"><label>Kategori (jadi tombol filter)</label><input type="text" data-p="photos.${i}.category" value="${esc(p.category)}"></div>
   <div class="f"><label>Harga (Rp)</label><input type="number" min="0" step="1000" data-num data-p="photos.${i}.price" value="${p.price}"></div></div>
   <div class="g3"><div class="f"><label>Model AI</label><input type="text" data-p="photos.${i}.model" value="${esc(p.model)}"></div>
   <div class="f"><label>Rasio</label><input type="text" data-p="photos.${i}.ratio" value="${esc(p.ratio)}"></div>
   <div class="f"><label>Ilustrasi bawaan (dipakai bila belum ada foto)</label><select data-p="photos.${i}.artType">${['coffee','cozy2d','cyber','villa','perfume','mascot2d'].map(a=>`<option ${p.artType===a?'selected':''}>${a}</option>`).join('')}</select></div></div>
   ${upField(`photos.${i}.imageUrl`,'Foto hasil render asli','image/*','JPG/PNG/WEBP. Rasio sekitar 16:10 paling pas. Tanpa foto, situs menampilkan ilustrasi berlabel "ILUSTRASI CONTOH".')}
   <div class="f"><label>Prompt lengkap</label><textarea class="mono" style="min-height:120px" data-p="photos.${i}.prompt">${esc(p.prompt)}</textarea><div class="hint">Yang terkunci: hanya cuplikan awal yang tampil di situs, sisanya dikirim manual lewat WhatsApp.</div></div>
   <div class="row"><label class="chk"><input type="checkbox" data-p="photos.${i}.free" ${p.free?'checked':''} data-rerender> Sampel gratis (prompt terbuka penuh)</label><label class="chk"><input type="checkbox" data-p="photos.${i}.hidden" ${p.hidden?'checked':''} data-rerender> Sembunyikan dari situs</label></div>${actions('photos',i)}</div></div>`).join('')||'<p style="color:var(--mute)">Belum ada produk.</p>';
}
function addPhoto(){S.photos.unshift({id:'',title:'Prompt foto baru',category:'Produk & Iklan',model:'Flux.1 Dev',ratio:'4:5',price:35000,imageUrl:'',prompt:'',free:false,hidden:false,artType:'coffee'});openItems=new Set(['photos0']);setDirty(true);render()}
function viewSbs(){
  return `<div class="row between" style="margin-bottom:12px"><div style="color:var(--mute);max-width:620px">Paket dua prompt: gambar keyframe + gerak video AI. Unggah video hasilnya (MP4/WEBM) supaya pembeli melihat hasil asli.</div><button class="btn dark" onclick="addSb()">+ Tambah paket storyboard</button></div>`+
  S.sbs.map((p,i)=>`<div class="item ${p.hidden?'off':''} ${openItems.has('sbs'+i)?'open':''}">${head('sbs',i,p,p.kf1Url||p.videoPoster,p.engine||p.category)}
   <div class="ibody"><div class="g3"><div class="f"><label>Judul</label><input type="text" data-p="sbs.${i}.title" data-live="title" value="${esc(p.title)}"></div>
   <div class="f"><label>Kategori</label><input type="text" data-p="sbs.${i}.category" value="${esc(p.category)}"></div>
   <div class="f"><label>Harga (Rp)</label><input type="number" min="0" step="1000" data-num data-p="sbs.${i}.price" value="${p.price}"></div></div>
   <div class="g3"><div class="f"><label>Engine / alat</label><input type="text" data-p="sbs.${i}.engine" value="${esc(p.engine)}"></div>
   <div class="f"><label>Label keyframe 1</label><input type="text" data-p="sbs.${i}.kf1Label" value="${esc(p.kf1Label)}"></div>
   <div class="f"><label>Label keyframe 2</label><input type="text" data-p="sbs.${i}.kf2Label" value="${esc(p.kf2Label)}"></div></div>
   <div class="g2">${upField(`sbs.${i}.kf1Url`,'Gambar keyframe 1','image/*','')}${upField(`sbs.${i}.kf2Url`,'Gambar keyframe 2','image/*','')}</div>
   <div class="g2">${upField(`sbs.${i}.videoUrl`,'Video hasil (MP4/WEBM)','video/mp4,video/webm','Maks 60 MB. Disarankan 9:16, durasi pendek.')}${upField(`sbs.${i}.videoPoster`,'Gambar sampul video (opsional)','image/*','')}</div>
   <div class="f"><label>Animasi ilustrasi bila belum ada video</label><select data-p="sbs.${i}.animType">${['none','coffeeMotion','charMotion','airMotion','saasMotion'].map(a=>`<option ${p.animType===a?'selected':''}>${a}</option>`).join('')}</select></div>
   <div class="g2"><div class="f"><label>Prompt gambar</label><textarea class="mono" style="min-height:110px" data-p="sbs.${i}.promptImage">${esc(p.promptImage)}</textarea></div>
   <div class="f"><label>Prompt gerak video AI</label><textarea class="mono" style="min-height:110px" data-p="sbs.${i}.promptVideo">${esc(p.promptVideo)}</textarea></div></div>
   <div class="row"><label class="chk"><input type="checkbox" data-p="sbs.${i}.free" ${p.free?'checked':''} data-rerender> Sampel gratis</label><label class="chk"><input type="checkbox" data-p="sbs.${i}.hidden" ${p.hidden?'checked':''} data-rerender> Sembunyikan dari situs</label></div>${actions('sbs',i)}</div></div>`).join('')||'<p style="color:var(--mute)">Belum ada paket.</p>';
}
function addSb(){S.sbs.unshift({id:'',title:'Paket storyboard baru',category:'Produk & Iklan',engine:'Kling + Remotion 2D',price:69000,kf1Label:'KF 01: Frame awal',kf2Label:'KF 02: Gerak utama',kf1Url:'',kf2Url:'',videoUrl:'',videoPoster:'',promptImage:'',promptVideo:'',free:false,hidden:false,animType:'none'});openItems=new Set(['sbs0']);setDirty(true);render()}

/* ---------- paket ---------- */
function viewBundles(){
  const note=`<div class="card"><b>Cara hitung otomatis.</b> Harga coret = jumlah harga satuan produk yang tampil di situs (jangkauan paket). Persentase hemat dihitung dari situ, jadi selalu cocok dengan katalog. Isi "Harga coret manual" hanya bila mau menimpa. Di teks bisa dipakai <code>{foto}</code> <code>{sb}</code> <code>{total}</code> (jumlah produk otomatis).</div>`;
  return note+`<div style="margin-bottom:12px"><button class="btn dark" onclick="addBundle()">+ Tambah paket</button></div>`+S.bundles.map((b,i)=>{
   const vp=S.photos.filter(x=>!x.hidden),vb=S.sbs.filter(x=>!x.hidden);const sum={photos:vp.reduce((a,x)=>a+x.price,0),storyboards:vb.reduce((a,x)=>a+x.price,0)};sum.all=sum.photos+sum.storyboards;
   const base=b.originalPrice>0?b.originalPrice:sum[b.scope];
   return `<div class="item ${b.hidden?'off':''} ${openItems.has('bundles'+i)?'open':''}">${head('bundles',i,b,'',b.scope==='photos'?'Semua prompt foto':b.scope==='storyboards'?'Semua storyboard':'Semua produk')}
   <div class="ibody"><div class="g3"><div class="f"><label>Nama paket</label><input type="text" data-p="bundles.${i}.title" data-live="title" value="${esc(b.title)}"></div>
   <div class="f"><label>Isi paket</label><select data-p="bundles.${i}.scope" data-rerender><option value="photos" ${b.scope==='photos'?'selected':''}>Semua prompt foto</option><option value="storyboards" ${b.scope==='storyboards'?'selected':''}>Semua storyboard</option><option value="all" ${b.scope==='all'?'selected':''}>Semua produk</option></select></div>
   <div class="f"><label>Harga paket (Rp)</label><input type="number" min="0" step="1000" data-num data-p="bundles.${i}.price" value="${b.price}"></div></div>
   <div class="g3"><div class="f"><label>Harga coret manual (kosong/0 = otomatis)</label><input type="number" min="0" data-num data-p="bundles.${i}.originalPrice" value="${b.originalPrice||0}"><div class="hint">Saat ini dipakai: ${rp(base)}${base>b.price?` → hemat ${Math.round((1-b.price/base)*100)}%`:' (tidak ada hemat)'}</div></div>
   <div class="f"><label>Label kecil di judul</label><input type="text" data-p="bundles.${i}.chip" value="${esc(b.chip)}"></div>
   <div class="f"><label>Label promo (kosong = "HEMAT Rp …" otomatis)</label><input type="text" data-p="bundles.${i}.badge" value="${esc(b.badge)}"><div class="hint">Jangan isi klaim seperti "paling laris" sebelum ada data penjualan.</div></div></div>
   <div class="f"><label>Deskripsi</label><textarea data-p="bundles.${i}.desc">${esc(b.desc)}</textarea></div>
   <div class="f"><label>Poin keunggulan (satu per baris)</label><textarea data-lines data-p="bundles.${i}.features">${esc((b.features||[]).join('\n'))}</textarea></div>
   <div class="f"><label>Teks tombol</label><input type="text" data-p="bundles.${i}.cta" value="${esc(b.cta)}"></div>
   <div class="row"><label class="chk"><input type="checkbox" data-p="bundles.${i}.highlighted" ${b.highlighted?'checked':''}> Tampil menonjol (kartu gelap)</label><label class="chk"><input type="checkbox" data-p="bundles.${i}.hidden" ${b.hidden?'checked':''} data-rerender> Sembunyikan</label></div>${actions('bundles',i)}</div></div>`}).join('');
}
function addBundle(){S.bundles.push({id:'',title:'Paket baru',chip:'',desc:'',scope:'all',price:99000,originalPrice:0,badge:'',cta:'Tambah ke keranjang',features:[],highlighted:false,hidden:false});openItems=new Set(['bundles'+(S.bundles.length-1)]);setDirty(true);render()}

/* ---------- teks & pengaturan ---------- */
function field(path,f,val){
  const id='x'+Math.random().toString(36).slice(2,7);
  if(f.type==='bool')return `<div class="f"><label class="chk"><input type="checkbox" data-p="${path}" ${val?'checked':''}> ${esc(f.label)}</label></div>`;
  if(f.type==='area')return `<div class="f"><label>${esc(f.label)}</label><textarea data-p="${path}">${esc(val)}</textarea></div>`;
  if(f.type==='int')return `<div class="f"><label>${esc(f.label)}</label><input type="number" min="${f.min||0}" max="${f.max||9999}" data-num data-p="${path}" value="${esc(val)}"></div>`;
  return `<div class="f"><label>${esc(f.label)}</label><input type="text" data-p="${path}" value="${esc(val)}"></div>`;
}
function viewTeks(){return `<div class="card" style="color:var(--mute)">Semua tulisan di halaman depan bisa diubah di sini. Kolom yang dikosongkan memakai tulisan bawaan situs.</div>`+SCHEMA.texts.map(g=>`<div class="card"><h3>${esc(g.g)}</h3><div class="g2">${g.fields.map(f=>field('t.'+f.k,f,S.t[f.k])).join('')}</div></div>`).join('')}
function viewSet(){return `<div class="card"><h3>Pesan &amp; kontak</h3>${SCHEMA.settings.filter(f=>['waNumber','waTemplate'].includes(f.k)).map(f=>field('s.'+f.k,f,S.s[f.k])).join('')}</div>
 <div class="card"><h3>Bar informasi paling atas</h3>${SCHEMA.settings.filter(f=>['annOn','ann'].includes(f.k)).map(f=>field('s.'+f.k,f,S.s[f.k])).join('')}<div class="hint" style="font-size:12px;color:var(--mute)">Ini pengganti banner "KERANGKA / DRAFT" lama. Tulis hanya hal yang benar dan bisa kamu penuhi (misalnya jam balas admin kalau memang konsisten).</div></div>
 <div class="card"><h3>Katalog &amp; paket</h3>${SCHEMA.settings.filter(f=>['previewChars','bundleBadge'].includes(f.k)).map(f=>field('s.'+f.k,f,S.s[f.k])).join('')}</div>
 <div class="card"><h3>Media sosial (footer)</h3>${SCHEMA.settings.filter(f=>['instagram','tiktok','youtube'].includes(f.k)).map(f=>field('s.'+f.k,f,S.s[f.k])).join('')}</div>
 <div class="card"><h3>Google &amp; judul tab</h3>${SCHEMA.settings.filter(f=>['seoTitle','seoDesc'].includes(f.k)).map(f=>field('s.'+f.k,f,S.s[f.k])).join('')}</div>`}

/* ---------- media / riwayat / keamanan ---------- */
async function viewMedia(){
  const el=$('#page');if(!MEDIA){try{MEDIA=(await api('media')).list}catch(e){toast(e.message,true);MEDIA=[]}}
  if(TAB!=='media')return;
  const used=new Set(JSON.stringify(S).match(/uploads\/[\w.\-]+/g)||[]);
  el.innerHTML=`<div class="row between" style="margin-bottom:12px"><div style="color:var(--mute)">Semua foto &amp; video yang pernah diunggah. Batas 60 MB per file; format JPG, PNG, WEBP, MP4, WEBM.</div>
   <label class="btn dark" style="cursor:pointer">+ Unggah file<input type="file" hidden multiple accept="image/*,video/mp4,video/webm" onchange="[...this.files].forEach(f=>uploadTo(f,null,()=>render()))"></label></div>
   <div class="media">${MEDIA.map(m=>{const v=/\.(mp4|webm)$/.test(m.url);return `<div class="mi"><div class="pv" style="${v?'':`background-image:url('/${esc(m.url)}')`}">${v?'VIDEO':''}</div><div class="in"><div>${esc(m.url.slice(8))}</div><div>${(m.bytes/1048576).toFixed(2)} MB · ${used.has(m.url)?'<b style="color:var(--ok)">dipakai</b>':'belum dipakai'}</div>
   <div class="row" style="margin-top:5px"><button class="btn sm" onclick="navigator.clipboard.writeText('${esc(m.url)}');toast('Alamat disalin')">Salin</button><button class="btn sm bad" onclick="delMedia('${esc(m.url.slice(8))}',${used.has(m.url)})">Hapus</button></div></div></div>`}).join('')||'<p style="color:var(--mute)">Belum ada file.</p>'}</div>`;
}
async function delMedia(f,used){if(!confirm(used?'File ini sedang dipakai di katalog. Tetap hapus? Gambar di situs akan hilang.':'Hapus file ini?'))return;try{await api('media?f='+encodeURIComponent(f),{method:'DELETE'});MEDIA=null;render()}catch(e){toast(e.message,true)}}
async function viewRiwayat(){
  let list=[];try{list=(await api('versions')).list}catch(e){toast(e.message,true)}
  if(TAB!=='riwayat')return;
  $('#page').innerHTML=`<div class="card" style="color:var(--mute)">Setiap kali menyimpan, versi sebelumnya dicadangkan otomatis (40 terakhir). Memulihkan akan langsung menerbitkan versi tersebut.</div>`+
   (list.map(f=>{const d=f.replace('.json','').replace(/T(\d\d)-(\d\d)-(\d\d)-\d+Z/,' $1:$2:$3 UTC');return `<div class="card row between" style="padding:10px 14px"><span class="mono">${esc(d)}</span><button class="btn sm" onclick="restore('${esc(f)}')">Pulihkan</button></div>`}).join('')||'<p style="color:var(--mute)">Belum ada cadangan.</p>');
}
async function restore(f){if(dirty&&!confirm('Ada perubahan yang belum disimpan dan akan hilang. Lanjut memulihkan?'))return;if(!confirm('Pulihkan versi ini dan terbitkan sekarang?'))return;
  try{const j=await api('restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:f})});S=j.store;setDirty(false);toast('Versi dipulihkan dan diterbitkan');render()}catch(e){toast(e.message,true)}}
function viewAman(){return `<div class="card" style="max-width:460px"><h3>Ganti password admin</h3>
  <div class="f"><label>Password lama</label><input type="password" id="pw0" autocomplete="current-password"></div>
  <div class="f"><label>Password baru (min. 10 karakter)</label><input type="password" id="pw1" autocomplete="new-password"></div>
  <button class="btn dark" onclick="chpw()">Ganti password</button></div>
  <div class="card"><h3>Keluar</h3><button class="btn" onclick="localStorage.removeItem(TK);location.reload()">Keluar dari ruang admin</button></div>`}
async function chpw(){try{await api('password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:$('#pw0').value,next:$('#pw1').value})});window.__firstPw=false;toast('Password diganti');$('#pw0').value=$('#pw1').value=''}catch(e){toast(e.message,true)}}

/* ---------- simpan ---------- */
$('#saveBtn').addEventListener('click',async()=>{
  const btn=$('#saveBtn');btn.disabled=true;
  try{const j=await api('store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});S=j.store;setDirty(false);toast('Tersimpan dan sudah tampil di situs');render(true)}
  catch(e){toast(e.message,true)}finally{btn.disabled=false}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&$('#shell')&&!$('#shell').classList.contains('hide')){e.preventDefault();$('#saveBtn').click()}});

function render(keepScroll){
  const y=scrollY;renderNav();const p=$('#page');
  if(TAB==='ringkasan')p.innerHTML=viewRingkasan();
  else if(TAB==='photos')p.innerHTML=viewPhotos();
  else if(TAB==='sbs')p.innerHTML=viewSbs();
  else if(TAB==='bundles')p.innerHTML=viewBundles();
  else if(TAB==='teks')p.innerHTML=viewTeks();
  else if(TAB==='set')p.innerHTML=viewSet();
  else if(TAB==='media'){p.innerHTML='<p style="color:var(--mute)">Memuat…</p>';viewMedia()}
  else if(TAB==='riwayat'){p.innerHTML='<p style="color:var(--mute)">Memuat…</p>';viewRiwayat()}
  else if(TAB==='aman')p.innerHTML=viewAman();
  if(keepScroll)scrollTo(0,y);
}
boot();
</script>
</body>
</html>
