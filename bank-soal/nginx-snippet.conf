# Bank Soal & Simulasi UO. HANYA menambah location baru di dalam server { } catatanakademik.com.
# Tidak mengubah location lain. Letakkan di atas location / (proxy ke aplikasi utama).
# Tidak memakai /api dan port 3100 milik aplikasi yang sudah ada.

# Halaman statis hasil build-ssg.js (isi /var/www/bank-soal/dist)
location ^~ /bank-soal/assets/ {
    alias /var/www/bank-soal/dist/bank-soal/assets/;
    expires 7d;
    add_header Cache-Control "public";
}
location ^~ /bank-soal/aktivasi/ {
    alias /var/www/bank-soal/dist/bank-soal/aktivasi/;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# API Node (port 3110, hanya localhost). Tidak diindeks.
location ^~ /bank-soal/api/ {
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 32k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /bank-soal {
    return 301 /bank-soal/;
}
location ^~ /bank-soal/ {
    alias /var/www/bank-soal/dist/bank-soal/;
    index index.html;
    try_files $uri $uri/ =404;
}
# Peta situs terpisah agar tidak menimpa sitemap.xml situs utama:
location = /sitemap-bank-soal.xml {
    alias /var/www/bank-soal/dist/sitemap.xml;
}
