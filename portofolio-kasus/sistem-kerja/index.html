<style>
/* VOICE: alat kerja profesional, tenang, berbasis bukti
   IDEA: ruang kerja operasional — map berkas per fase, dari riset sampai portofolio
   PICTURE: dashboard progres 10 fase + modul kerja yang benar-benar bisa diisi
   COLOUR/TYPE: grafit monokrom (tema portofolio), aksen oranye untuk aksi; Space Grotesk + Inter

:root{color-scheme:dark;--bg:#0f1012;--p:#17181b;--p2:#1e2024;--ln:#2b2d32;--ink:#ececec;--mu:#9b9da4;--ac:#ff7a1a;--ok:#5fd08a;--wr:#f2c14e;--er:#ff6b6b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(26px,3.4vw,40px);text-wrap:balance}h2{font-size:22px}h3{font-size:17px;margin:22px 0 10px}
a{color:var(--ac)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{background:var(--p);border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.back{display:inline-block;color:var(--mu);font-size:13px;text-decoration:none;padding:4px 8px 10px}.back:hover{color:inherit;text-decoration:underline}.mback{display:none}
.brand{padding:4px 8px 16px;border-bottom:1px solid var(--ln);margin-bottom:12px}
.brand b{font-family:"Space Grotesk";font-size:19px;display:block}.brand small{color:var(--mu)}
.grp{color:var(--mu);font-size:12px;margin:14px 8px 4px}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--p2)}.nav a.on{background:var(--p2);box-shadow:inset 3px 0 0 var(--ac)}
.nav a i{font-style:normal;color:var(--mu);font-size:12px}
main{padding:clamp(18px,3vw,40px);max-width:1240px;width:100%}
.mnav{display:none}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
.head p{color:var(--mu);margin:8px 0 0;max-width:70ch}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.tag.demo{border-color:var(--wr);color:var(--wr)}.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.er{border-color:var(--er);color:var(--er)}.tag.ac{border-color:var(--ac);color:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:18px;scrollbar-width:thin}
.tabs button{flex:none;background:none;border:0;color:var(--mu);padding:11px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;min-height:44px}
.tabs button.on{color:var(--ink);border-color:var(--ac)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.frm{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.frm .w{grid-column:1/-1}
label{display:grid;gap:5px;font-size:13px;color:var(--mu)}
input,select,textarea{font:16px Inter,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:9px;padding:10px 11px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:#140a02;border:0;border-radius:9px;padding:10px 16px;font:600 14px Inter;cursor:pointer;min-height:44px}
.btn.g{background:var(--p2);color:var(--ink);border:1px solid var(--ln)}.btn.s{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:13px}td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{border:1px dashed var(--ln);border-radius:12px;padding:22px;color:var(--mu);text-align:center}
.msg{font-size:13px;min-height:18px}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
.bar{height:8px;background:var(--p2);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .5s}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.stat b{font:700 28px "Space Grotesk";display:block}.stat small{color:var(--mu)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;accent-color:var(--ac);flex:none;margin-top:2px}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:14px;white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace;overflow-x:auto}
ul.l{margin:0;padding-left:20px}ul.l li{margin:4px 0}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.steps button{flex:none;border:1px solid var(--ln);background:var(--p);color:var(--mu);border-radius:99px;padding:8px 13px;font:13px Inter;cursor:pointer;min-height:40px}
.steps button.on{border-color:var(--ac);color:var(--ink)}.steps button.dn{color:var(--ok)}
.fun{display:grid;gap:6px}.fun div{display:grid;grid-template-columns:170px minmax(0,1fr) 90px 90px;gap:10px;align-items:center;font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--p)}.kc{padding:14px 16px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);display:grid;gap:4px;align-content:start}.kc small{color:var(--mu);font-size:13px}.kc b{font:700 26px 'Space Grotesk',sans-serif}.kc span{color:var(--mu);font-size:12px;line-height:1.35}.kc.hi{background:rgba(255,122,26,.12)}.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ln);border-radius:9px;overflow:hidden}.seg button{background:none;border:0;color:var(--mu);padding:8px 12px;font:13px Inter;cursor:pointer;min-height:36px}.seg button.on{background:var(--ac);color:#140a02;font-weight:600}.nav a .lb{display:flex;align-items:center;gap:10px}@media(max-width:820px){#dashTwo{grid-template-columns:1fr!important}}
.warn{border-left:3px solid var(--wr);padding:8px 12px;background:var(--p2);border-radius:6px;font-size:14px;margin:10px 0}
.banner{font-size:12px;color:var(--wr);margin-top:6px}
@media(max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr)}aside{padding:16px 10px}.brand small{display:none}.nav a{padding:7px 8px;font-size:13px}}
@media(max-width:560px){.app{grid-template-columns:1fr}aside{display:none}.mback{display:inline-block;padding-left:0}.mnav{display:block;margin-bottom:14px}.fun div{grid-template-columns:110px minmax(0,1fr) 70px}.fun div span:last-child{display:none}}
@media(max-width:600px){table{font-size:13px}.row{grid-template-columns:110px minmax(0,1fr) 44px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mu)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

 return`${n<10?`<div class="warn">Belum cukup data: ${n} jawaban. Kesimpulan pasar membutuhkan minimal 10 jawaban dari segmen yang sama.</div>`:''}<div class="grid">${blk('Top pain points','pain_point')}${blk('Top desires','desired_outcome')}${blk('Keberatan umum','buying_objection')}${blk('Sinyal permintaan produk','product_interest')}</div>

 const best=g=>{const x=g.filter(v=>v.n>=2).sort((a,b)=>(b.er||0)-(a.er||0))[0];return x?`${esc(x.v)} (ER ${fmt(x.er)}%, n=${x.n})`:'Belum cukup data'};
 return`${demoNote(c)}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${card('Executive summary',`<div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><div class="stat"><b>${fmt(sumk(c,'reach'))}</b><small>Reach</small></div><div class="stat"><b>${fmt(sumk(c,'views'))}</b><small>Views</small></div><div class="stat"><b>${fmt(erOf(c))}%</b><small>Engagement rate</small></div><div class="stat"><b>${c.length}</b><small>Posting dianalisis</small></div></div>`,'ER = engagement / reach × 100')}${card('Content pillar',`<p>Terbaik: ${best(groupBy(c,'pillar'))}</p>`,'ER per pillar')}${card('Platform comparison',(()=>{const g=groupBy(c,'platform'),mx=Math.max(...g.map(x=>x.er||0),1);return g.map(x=>`<div class="row" style="grid-template-columns:90px minmax(0,1fr) 70px"><span>${esc(x.v)}</span><div class="bar"><span style="width:${(x.er||0)/mx*100}%"></span></div><span class="n">${fmt(x.er)}%</span></div>`).join('')})(),'ER per platform')}${card('Retention video',`<p>Rata-rata completion: ${avg(c,'completion')==null?'Belum cukup data':fmt(avg(c,'completion'))+'%'}<br>Rata-rata watch time: ${avg(c,'avg_watch')==null?'Belum cukup data':fmt(avg(c,'avg_watch'))+' dtk'}</p>`,'rata-rata per posting')}${card('Social listening',cm.length?`<p>${cm.length} komentar · negatif ${cm.filter(x=>x.sent==='Negatif').length} · pertanyaan ${cm.filter(x=>x.intent==='Bertanya').length} · direview ${cm.filter(x=>x.rev).length}</p>`:'<p>Belum tersedia</p>')}${card('Data quality',Object.entries(cnt).map(([k,v])=>`<span class="tag ${k==='ok'?'ok':k==='demo_data'?'demo':'er'}" style="margin:2px">${k}: ${v}</span>`).join(''),'status cleaning')}${card('Recommendation tracker',reco.length?['Baru','Berjalan','Selesai','Dibatalkan'].map(s=>`<span class="tag" style="margin:2px">${s}: ${reco.filter(r=>r.status===s).length}</span>`).join(''):'<p>Belum ada rekomendasi</p>')}${card('Experiment tracking',`<p>${R('experiments').length} eksperimen tercatat di menu Eksperimen.</p>`)}</div>`};
