# Tempel di dalam blok  server { ... }  domain lo (biasanya /etc/nginx/sites-available/<domain>)
# PENTING: kalau Sahabat Nugas sudah jalan di /app, biarkan blok location /app yang lama tetap ADA
# dan taruh di ATAS blok di bawah ini.

client_max_body_size 10m;   # izinkan upload foto sampai 8MB

location / {
    proxy_pass         http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
