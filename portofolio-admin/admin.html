<!DOCTYPE html>
<html lang="id">
<head>

<style>

*{box-sizing:border-box}html,body{margin:0}

.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 120px}

.sp{flex:1}
.btn{border:1px solid var(--line);background:#ffffff08;border-radius:10px;padding:9px 14px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#ffffff14;border-color:var(--gold)}

.bar span{color:var(--mut);font-size:13px}
.bar.dirty span{color:var(--gold2)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:18px}

label.f,div.f{display:block;margin:0 0 14px}
a.btn{color:var(--tx);text-decoration:none;display:inline-block}
label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}

textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{background:#e2b86b22;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;display:flex;gap:6px;align-items:center}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0e1633;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:50;max-width:92vw}
.toast.err{border-color:var(--bad);color:#fecaca}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.slides{display:flex;gap:8px;flex-wrap:wrap}.slides .sl{position:relative}.slides img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.slides .sl button{position:absolute;top:-6px;right:-6px;border-radius:50%;width:22px;height:22px;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
.slides .sl b{position:absolute;left:3px;bottom:3px;background:#000b;border-radius:5px;font-size:11px;padding:0 5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
h2{font-size:17px;margin:0 0 10px}
.mt{margin-top:18px}
.empty{color:var(--mut);padding:18px;text-align:center}
</style>
</head>

/* ---------- Galeri Karya ---------- */
