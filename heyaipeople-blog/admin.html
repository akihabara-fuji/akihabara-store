<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin HeyAIPeople</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#FAFAFA;color:#09090B}.hd{font-family:'Plus Jakarta Sans',sans-serif}
.card{background:#fff;border:1px solid #E4E4E7;border-radius:16px}
.inp{width:100%;border:1px solid #D4D4D8;border-radius:10px;padding:9px 12px;font-size:14px;background:#fff}
.inp:focus{outline:2px solid #FF4D1C33;border-color:#FF4D1C}
.btn{background:#FF4D1C;color:#fff;font-weight:600;border-radius:10px;padding:9px 16px;font-size:14px}.btn:disabled{opacity:.5}
.btn2{border:1px solid #D4D4D8;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;background:#fff}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:#52525B;width:100%;text-align:left}
.nav.on{background:#FFF1EC;color:#FF4D1C}.lbl{font-size:12px;font-weight:600;color:#52525B;margin-bottom:4px;display:block}
.sw{width:42px;height:24px;border-radius:99px;background:#D4D4D8;position:relative;cursor:pointer;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#FF4D1C}.sw.on::after{left:21px}
.drop{border:2px dashed #D4D4D8;border-radius:14px;text-align:center;padding:18px;cursor:pointer}.drop:hover,.drop.dg{border-color:#FF4D1C;background:#FFF8F5}
</style></head><body>
<div id="login" class="hidden min-h-screen flex items-center justify-center p-5"><div class="card p-7 w-full max-w-sm">
<div class="hd font-extrabold text-xl mb-1">hey<span style="color:#FF4D1C">ai</span>people <span class="text-xs text-zinc-400">admin</span></div>
<p class="text-sm text-zinc-500 mb-4">Masuk untuk mengatur isi web.</p>
<input id="pw" type="password" class="inp mb-3" placeholder="Kata sandi" onkeydown="if(event.key==='Enter')login()">
<button class="btn w-full" onclick="login()">Masuk</button><div id="lerr" class="text-sm text-red-600 mt-3"></div></div></div>
<div id="app" class="hidden">
<div class="flex min-h-screen">
<aside class="w-56 bg-white border-r border-zinc-200 p-4 hidden md:block shrink-0">
<div class="hd font-extrabold text-lg mb-6">hey<span style="color:#FF4D1C">ai</span>people</div><nav class="space-y-1" id="nav"></nav>
<div class="mt-8 text-xs text-zinc-400"><a href="/" target="_blank" class="underline">Lihat web</a> · <a href="#" onclick="logout()" class="underline">Keluar</a></div></aside>
<main class="flex-1 p-5 md:p-8 max-w-5xl"><div class="md:hidden flex gap-2 overflow-x-auto mb-4" id="nav2"></div>
<div id="status" class="flex items-center gap-2 text-xs mb-4"></div><div id="view"></div></main></div></div>
<div id="toast" class="fixed bottom-5 right-5 bg-zinc-900 text-white text-sm px-4 py-3 rounded-xl hidden max-w-xs"></div>
<script>
const PRESET=['#FF4D1C','#7C3AED','#0EA5E9','#16A34A','#DB2777','#09090B'];
const ARTS=[['cyber','Cyberpunk'],['coffee','Kopi / produk'],['villa','Villa / properti'],['cozy2d','Ilustrasi 2D'],['perfume','Parfum'],['mascot2d','Maskot 2D']];
let S=null,tab='prod',sel=0,dirty=false,versions=[];
const $=id=>document.getElementById(id);
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.add('hidden'),3200)}
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',headers:{'x-hp':'1','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&p!=='/api/login'){showLogin();throw new Error('Sesi habis, masuk lagi')}if(!r.ok)throw new Error(j.error||'Gagal');return j}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function login(){$('lerr').textContent='';try{await api('/api/login','POST',{password:$('pw').value});$('pw').value='';start()}catch(e){$('lerr').textContent=e.message}}
async function logout(){await api('/api/logout','POST');location.reload()}
async function start(){try{S=await api('/api/admin/state');}catch(e){showLogin();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');dirty=false;render()}
const TABS=[['prod','Produk + Galeri'],['paket','Paket / Bundle'],['isi','Cara Pesan · FAQ · Footer'],['stat','Pesanan & Statistik'],['blog','Blog'],['bk','Backup Otomatis'],['site','Tampilan Web'],['teks','Teks Halaman'],['set','Pengaturan'],['ver','Riwayat versi']];
function setDirty(){if(!dirty){dirty=true;stat()}}
function stat(){$('status').innerHTML=dirty?'<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold">● Perubahan belum disimpan</span>':'<span class="px-2.5 py-1 rounded-full bg-green-100 text-green-800 font-semibold">● Sudah tayang di web</span>'}
async function go(t){if(dirty){if(!confirm('Perubahan belum disimpan. Pindah halaman tanpa simpan? (perubahan dibuang)'))return;await reload()}tab=t;render()}
async function reload(){S=await api('/api/admin/state');dirty=false}
function render(){
 $('nav').innerHTML=TABS.map(t=>`<button class="nav ${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('nav2').innerHTML=TABS.map(t=>`<button class="btn2 whitespace-nowrap ${tab==t[0]?'!border-orange-500':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 stat();({prod,paket,isi,stat:sta,blog:blogv,bk,site,teks,set:setv,ver})[tab]();
}
function head(t,sub,x=''){return `<div class="flex flex-wrap items-start justify-between gap-3 mb-5"><div><h1 class="text-2xl font-extrabold hd">${t}</h1><p class="text-sm text-zinc-500 mt-1">${sub}</p></div>${x}</div>`}
function sw(on,fn){return `<div class="sw ${on?'on':''}" onclick="${fn}"></div>`}
function thumb(p,c='w-10 h-10'){p=Object.assign({},p,{img:p.img||p.kf1Img});return p.img?`<img src="${E(p.img)}" class="${c} rounded-xl object-cover">`:`<div class="${c} rounded-xl flex items-center justify-center text-white text-[10px] font-bold" style="background:linear-gradient(135deg,#FF4D1C,#7C3AED)">${p.kind=='photo'?'FOTO':'SB'}</div>`}
async function saveAll(note){const b=$('sv');if(b)b.disabled=true;try{const r=await api('/api/admin/save','POST',{products:S.products,site:S.site});S=r.state;dirty=false;render();toast(note||'Tersimpan & tayang di web ✓')}catch(e){toast('Gagal: '+e.message);if(b)b.disabled=false}}
function bar(){return `<div class="flex flex-wrap gap-2 pt-3 border-t border-zinc-100"><button id="sv" class="btn" onclick="saveAll()">Simpan & tayangkan</button><a class="btn2" href="/" target="_blank">Lihat web</a></div>`}

function prod(){
 const L=S.products.map((x,i)=>`<div class="flex items-center gap-1 rounded-xl ${i==sel?'bg-orange-50 ring-1 ring-orange-300':'hover:bg-zinc-50'}"><div class="flex flex-col text-zinc-400 px-1 text-xs"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button></div><button onclick="pick(${i})" class="flex-1 flex gap-2 items-center p-2 text-left min-w-0">${thumb(x)}<div class="min-w-0"><div class="text-sm font-semibold truncate">${x.pin?'📌 ':''}${E(x.title)||'(tanpa nama)'}</div><div class="text-xs text-zinc-500">${x.access=='free'?'Gratis':rp(x.price)}${x.show?'':' · <span class="text-amber-600">disembunyikan</span>'}</div></div></button></div>`).join('');
 const p=S.products[sel];
 let ed='<div class="card p-8 text-center text-sm text-zinc-500">Belum ada produk. Klik "+ Produk baru".</div>';
 if(p){const ph=p.kind=='photo';
 ed=`<div class="card p-5 space-y-4">
 ${ph?`<div><span class="lbl">Galeri foto (maks. 6, foto pertama = cover; kosong = gambar otomatis)</span><div class="grid grid-cols-3 md:grid-cols-6 gap-3">${(p.gallery||[]).map((g,gi)=>`<div class="relative"><img src="${E(g)}" class="aspect-[3/4] w-full rounded-xl object-cover">${gi==0?'<span class="absolute top-1 left-1 text-[10px] bg-black text-white px-1.5 rounded">COVER</span>':''}<button class="absolute top-1 right-1 bg-white rounded-full w-5 h-5 text-xs shadow" onclick="gdel(${gi})">✕</button><div class="flex justify-center gap-3 text-zinc-500 mt-1 text-sm"><button onclick="gmv(${gi},-1)">◀</button><button onclick="gmv(${gi},1)">▶</button></div></div>`).join('')}${(p.gallery||[]).length<6?`<div class="drop aspect-[3/4] flex items-center justify-center text-xs text-zinc-500" onclick="$('f').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();gadd(event.dataTransfer.files)">+ Tambah foto<br>(klik atau tarik)</div><input id="f" type="file" accept="image/*" multiple class="hidden" onchange="gadd(this.files)">`:''}</div><div class="mt-3"><span class="lbl">Keterangan foto (untuk SEO & pembaca layar)</span><input class="inp" value="${E(p.alt)}" oninput="S.products[sel].alt=this.value;setDirty()"></div></div>`:''}
 <div class="grid md:grid-cols-2 gap-3">
  <div class="md:col-span-2"><span class="lbl">Nama produk</span><input class="inp" value="${E(p.title)}" oninput="S.products[sel].title=this.value;setDirty()"></div>
  <div><span class="lbl">Kategori</span><input class="inp" value="${E(p.category)}" oninput="S.products[sel].category=this.value;setDirty()"></div>
  ${ph?`<div><span class="lbl">Model AI</span><input class="inp" value="${E(p.model)}" oninput="S.products[sel].model=this.value;setDirty()"></div><div><span class="lbl">Rasio (mis. 4:5)</span><input class="inp" value="${E(p.ratio)}" oninput="S.products[sel].ratio=this.value;setDirty()"></div><div><span class="lbl">Gaya gambar otomatis</span><select class="inp" onchange="S.products[sel].artType=this.value;setDirty()">${ARTS.map(a=>`<option value="${a[0]}" ${a[0]==p.artType?'selected':''}>${a[1]}</option>`).join('')}</select></div>`
  :`<div><span class="lbl">Engine</span><input class="inp" value="${E(p.engine)}" oninput="S.products[sel].engine=this.value;setDirty()"></div><div><span class="lbl">Label keyframe 1</span><input class="inp" value="${E(p.kf1Label)}" oninput="S.products[sel].kf1Label=this.value;setDirty()"></div><div><span class="lbl">Label keyframe 2</span><input class="inp" value="${E(p.kf2Label)}" oninput="S.products[sel].kf2Label=this.value;setDirty()"></div>${[1,2].map(n=>`<div><span class="lbl">Foto keyframe ${n} (opsional)</span>${p['kf'+n+'Img']?`<img src="${E(p['kf'+n+'Img'])}" class="w-24 h-24 rounded-xl object-cover mb-2"><button class="btn2" onclick="S.products[sel].kf${n}Img='';setDirty();render()">Hapus foto</button>`:`<div class="drop" onclick="$('kf${n}').click()">+ Pilih foto<input id="kf${n}" type="file" accept="image/*" class="hidden" onchange="kfup(${n},this.files[0])"></div>`}</div>`).join('')}`}
 </div>
 <div><span class="lbl">Cara dijual</span><div class="grid md:grid-cols-2 gap-2">
  <label class="card p-3 cursor-pointer ${p.access=='paid'?'!border-orange-500 bg-orange-50':''}"><input type="radio" name="ac" ${p.access=='paid'?'checked':''} onchange="S.products[sel].access='paid';setDirty();render()"> <b class="text-sm">Berbayar</b><div class="text-xs text-zinc-500 mt-1">Prompt dikunci. Isi rahasia tidak dikirim ke pengunjung.</div></label>
  <label class="card p-3 cursor-pointer ${p.access=='free'?'!border-orange-500 bg-orange-50':''}"><input type="radio" name="ac" ${p.access=='free'?'checked':''} onchange="S.products[sel].access='free';setDirty();render()"> <b class="text-sm">Gratis (contoh)</b><div class="text-xs text-zinc-500 mt-1">Prompt terbuka untuk semua pengunjung.</div></label></div></div>
 ${p.access=='paid'?`<div><span class="lbl">Harga (Rp)</span><input class="inp md:w-60" type="number" min="0" value="${p.price}" oninput="S.products[sel].price=+this.value;setDirty()"></div>`:''}
 ${ph?`<div><span class="lbl">Prompt — bagian yang boleh terlihat (pembuka)</span><textarea class="inp" rows="2" oninput="S.products[sel].promptPrefix=this.value;setDirty()">${E(p.promptPrefix)}</textarea></div><div><span class="lbl">Prompt — bagian rahasia ${p.access=='paid'?'(hanya dikirim setelah bayar)':'(untuk produk gratis ikut terbuka)'}</span><textarea class="inp" rows="4" oninput="S.products[sel].promptSecret=this.value;setDirty()">${E(p.promptSecret)}</textarea><button class="btn2 mt-2" onclick="cp()">Salin isi prompt lengkap</button></div>`
 :`<div><span class="lbl">Prompt gambar (70 huruf pertama terlihat, sisanya terkunci)</span><textarea class="inp" rows="3" oninput="S.products[sel].promptImage=this.value;setDirty()">${E(p.promptImage)}</textarea></div><div><span class="lbl">Prompt video (rahasia)</span><textarea class="inp" rows="3" oninput="S.products[sel].promptVideo=this.value;setDirty()">${E(p.promptVideo)}</textarea><button class="btn2 mt-2" onclick="cp()">Salin isi prompt lengkap</button></div>`}
 <div class="flex flex-wrap gap-6"><label class="flex items-center gap-2 text-sm">${sw(p.show,"S.products[sel].show=!S.products[sel].show;setDirty();render()")} Tampil di web</label><label class="flex items-center gap-2 text-sm">${sw(p.pin,"S.products[sel].pin=!S.products[sel].pin;setDirty();render()")} Unggulan (pin di atas)</label></div>
 ${bar()}<button class="text-sm text-red-600" onclick="del()">Hapus produk ini</button></div>`}
 $('view').innerHTML=head('Produk','Urutan di daftar = urutan di web (produk "Unggulan" selalu paling atas).',`<div class="flex gap-2"><button class="btn" onclick="add('photo')">+ Prompt foto</button><button class="btn2" onclick="add('storyboard')">+ Storyboard</button></div>`)+`<div class="grid md:grid-cols-[290px_1fr] gap-4"><div class="card p-2 space-y-1 h-fit">${L}</div>${ed}</div>`;
}
function pick(i){if(dirty&&!confirm('Perubahan belum disimpan. Pindah produk tanpa simpan? (perubahan tetap di layar, belum tayang)'))return;sel=i;render()}
function mv(i,d){const j=i+d,a=S.products;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(sel==i)sel=j;else if(sel==j)sel=i;setDirty();render()}
function add(k){const b={kind:k,id:'n'+Date.now().toString(36),title:'Produk baru',category:'',price:29000,access:'paid',show:false,pin:false};
 S.products.unshift(k=='photo'?Object.assign(b,{model:'',ratio:'4:5',artType:'cyber',img:'',gallery:[],alt:'',promptPrefix:'',promptSecret:''}):Object.assign(b,{price:59000,engine:'',animType:'coffeeMotion',kf1Label:'KF 01',kf2Label:'KF 02',kf1Img:'',kf2Img:'',promptImage:'',promptVideo:''}));sel=0;setDirty();render()}
function del(){if(confirm('Hapus produk ini dari daftar? (tersimpan di Riwayat versi sampai 20 simpanan)')){S.products.splice(sel,1);sel=0;setDirty();render()}}
function cp(){const p=S.products[sel];const t=p.kind=='photo'?p.promptPrefix+p.promptSecret:p.promptImage+'\n\n'+p.promptVideo;navigator.clipboard.writeText(t).then(()=>toast('Prompt disalin — tinggal tempel ke WhatsApp pembeli'),()=>toast('Gagal menyalin'))}
function shrink(f){return new Promise((ok,no)=>{if(!f||!f.type.startsWith('image/'))return no(new Error('File harus gambar'));if(f.size>15e6)return no(new Error('Foto terlalu besar (maks. 15 MB)'));
 const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  c.toBlob(async b=>{try{const r=await fetch('/api/admin/upload',{method:'POST',headers:{'x-hp':'1','Content-Type':'image/jpeg'},body:b});const j=await r.json();if(!r.ok)throw new Error(j.error);ok(j.url)}catch(er){no(new Error('Gagal upload: '+er.message))}},'image/jpeg',.82)};im.onerror=()=>no(new Error('Foto tidak bisa dibaca'));im.src=e.target.result};r.readAsDataURL(f)})}
async function gadd(files){const p=S.products[sel];p.gallery=p.gallery||[];for(const f of [...files]){if(p.gallery.length>=6){toast('Maksimal 6 foto');break}try{p.gallery.push(await shrink(f));p.img=p.gallery[0]}catch(e){toast(e.message)}}setDirty();render()}
function gdel(i){const p=S.products[sel];p.gallery.splice(i,1);p.img=p.gallery[0]||'';setDirty();render()}
function gmv(i,d){const g=S.products[sel].gallery,j=i+d;if(j<0||j>=g.length)return;[g[i],g[j]]=[g[j],g[i]];S.products[sel].img=g[0];setDirty();render()}
async function kfup(n,f){try{S.products[sel]['kf'+n+'Img']=await shrink(f);setDirty();render();toast('Foto keyframe terupload ✓')}catch(e){toast(e.message)}}

function site(){const s=S.site;
 const F=(k,l,t)=>`<div><span class="lbl">${l}</span>${t?`<textarea class="inp" rows="3" oninput="S.site.${k}=this.value;setDirty();pv()">${E(s[k])}</textarea>`:`<input class="inp" value="${E(s[k])}" oninput="S.site.${k}=this.value;setDirty();pv()">`}</div>`;
 $('view').innerHTML=head('Tampilan Web','Teks banner utama, tombol, dan warna. Pratinjau di kanan langsung berubah.')+`<div class="grid md:grid-cols-2 gap-4"><div class="card p-5 space-y-3">
 ${F('heroA','Judul — bagian awal')}${F('heroEm','Judul — bagian berwarna (sorotan)')}${F('heroB','Judul — bagian akhir')}${F('lead','Kalimat di bawah judul',1)}${F('cta1','Teks tombol 1')}${F('cta2','Teks tombol 2')}
 <div><span class="lbl">Warna utama (pilihan aman, tulisan tetap terbaca)</span><div class="flex gap-2">${PRESET.map(c=>`<button class="w-9 h-9 rounded-full border-2 ${s.accent==c?'border-zinc-900':'border-transparent'}" style="background:${c}" onclick="S.site.accent='${c}';setDirty();render()"></button>`).join('')}</div></div>${bar()}</div>
 <div class="card p-5"><h3 class="font-bold mb-3">Pratinjau</h3><div id="pv" class="rounded-2xl p-6 bg-zinc-50 border border-zinc-200"></div><p class="text-xs text-zinc-400 mt-3">Tampilan asli bisa dilihat lewat "Lihat web" setelah disimpan.</p></div></div>`;pv()}
function pv(){const e=$('pv');if(!e)return;const s=S.site;e.innerHTML=`<div class="hd text-xl font-extrabold leading-tight">${E(s.heroA)} <span style="color:${s.accent}">${E(s.heroEm)}</span> ${E(s.heroB)}</div><p class="text-sm text-zinc-500 mt-2">${E(s.lead)}</p><div class="mt-4 flex gap-2 flex-wrap"><span class="text-white text-sm font-semibold px-4 py-2 rounded-full" style="background:${s.accent}">${E(s.cta1)}</span><span class="text-sm font-semibold px-4 py-2 rounded-full border">${E(s.cta2)}</span></div>`}

const TG=[['Menu atas',['nav1','nav2','nav3','nav4']],['Banner depan',['pill','st1','st2n','st2','st3n','st3','chip1','chip2','chip3','cap1a','cap1b','cap2a','cap2b','cap3a','cap3b']],['Pita berjalan (pisahkan dengan koma)',['mq']],['Judul bagian',['aK','aT','aS','bK','bT','bS','cK','cT','dK','dT','dS']],['Lain-lain',['search','follow']]];
const TL={nav1:'Menu 1',nav2:'Menu 2',nav3:'Menu 3',nav4:'Menu 4',pill:'Label kecil atas judul',st1:'Statistik 1 (keterangan; angkanya otomatis)',st2n:'Statistik 2 angka',st2:'Statistik 2 keterangan',st3n:'Statistik 3 angka',st3:'Statistik 3 keterangan',chip1:'Chip 1',chip2:'Chip 2',chip3:'Chip 3',cap1a:'Kartu 1 judul',cap1b:'Kartu 1 sub',cap2a:'Kartu 2 judul',cap2b:'Kartu 2 sub',cap3a:'Kartu 3 judul',cap3b:'Kartu 3 sub',mq:'Daftar kata',aK:'Katalog A label',aT:'Katalog A judul',aS:'Katalog A keterangan',bK:'Katalog B label',bT:'Katalog B judul',bS:'Katalog B keterangan',cK:'Cara kerja label',cT:'Cara kerja judul',dK:'Bundling label ({hemat} = persen hemat tertinggi, dihitung otomatis dari paket)',dT:'Bundling judul',dS:'Bundling keterangan',search:'Teks kolom cari',follow:'Teks sebelum link sosial'};
function teks(){const s=S.site,b=s.banner||(s.banner={on:false,text:'',link:''});
 $('view').innerHTML=head('Teks Halaman','Semua tulisan tetap di web selain produk, paket, FAQ dan footer. Kosongkan kolom bila tidak ingin tampil.')+
 `<div class="card p-5 mb-4"><b>Banner pengumuman</b><div class="flex items-center gap-3 mt-3">${sw(b.on,`S.site.banner.on=!S.site.banner.on;setDirty();render()`)}<span class="text-sm">Tampilkan di paling atas web</span></div><div class="grid md:grid-cols-2 gap-3 mt-3"><div><span class="lbl">Teks</span><input class="inp" value="${E(b.text)}" oninput="S.site.banner.text=this.value;setDirty()"></div><div><span class="lbl">Link (opsional, https://…)</span><input class="inp" value="${E(b.link)}" oninput="S.site.banner.link=this.value;setDirty()"></div></div></div>`+

 +`<div class="card p-3 md:p-5"><div class="text-sm font-bold mb-2">Daftar artikel (${B.length}) · ${n('tayang')} tayang · ${n('jadwal')} terjadwal · ${n('draft')} draf</div>`
 +(B.length?`<div class="overflow-x-auto"><table class="w-full text-sm"><tr class="text-left text-xs text-zinc-500"><th class="p-2"></th><th class="p-2">Judul</th><th class="p-2">Kategori</th><th class="p-2">Jam tayang</th><th class="p-2">Audit SEO</th><th class="p-2">Status</th><th class="p-2"></th></tr>`
 +B.map(r=>`<tr class="border-t border-zinc-100"><td class="p-2"><input type="checkbox" ${bchk.has(r.slug)?'checked':''} onchange="btog('${r.slug}',this.checked)"></td><td class="p-2 font-semibold">${E(r.title)}</td><td class="p-2 text-zinc-500">${E(r.cat)}</td><td class="p-2 text-zinc-500 whitespace-nowrap">${wibTxt(r)}</td><td class="p-2">${baud(r)}</td><td class="p-2">${bst(r)}</td><td class="p-2 whitespace-nowrap"><button class="btn2 !py-1 !px-3" onclick="bopen('${r.slug}')">Ubah</button>${r.status==='tayang'?` <a class="btn2 !py-1 !px-3" href="/blog/${r.slug}/" target="_blank">Lihat</a>`:''}</td></tr>`).join('')+'</table></div>':'<p class="text-sm text-zinc-500 p-2">Belum ada artikel. Unggah file .md di atas.</p>')+'</div>';
 const d=$('bdrop');d.ondragover=e=>{e.preventDefault();d.classList.add('dg')};d.ondragleave=()=>d.classList.remove('dg');d.ondrop=e=>{e.preventDefault();d.classList.remove('dg');bimp(e.dataTransfer.files)};
}
function btog(s,on){on?bchk.add(s):bchk.delete(s)}
function bpick(st){bchk=new Set(B.filter(r=>r.status===st).map(r=>r.slug));blogv()}
async function bimp(files){const fs=[...files].filter(f=>/\.(md|markdown|txt)$/i.test(f.name)).slice(0,20);if(!fs.length){toast('Pilih file .md');return}
 const arr=[];for(const f of fs){if(f.size>400e3){toast(f.name+' terlalu besar');continue}arr.push({name:f.name,text:await f.text()})}
 try{const r=await api('/api/admin/posts/import','POST',{files:arr});B=r.list;blogv();$('bres').innerHTML=r.res.map(x=>{const l=x.slug?B.find(y=>y.slug===x.slug):null,a=l&&l.audit,bad=a?a.checks.filter(c=>!c.ok&&c.level==='err'):[];return `<div class="${x.ok?(bad.length?'text-amber-600':'text-green-700'):'text-red-600'}">${x.ok?(bad.length?'!':'✓'):'✗'} ${E(x.name)} — ${E(x.msg)}${a?` · audit ${a.ok?'lolos':'belum lolos'} (skor ${a.score})`:''}${bad.length?`<div class="pl-4 text-xs">${bad.slice(0,4).map(c=>'• '+E(c.msg)).join('<br>')}${bad.length>4?'<br>• …dan '+(bad.length-4)+' lainnya':''}</div>`:''}</div>`}).join('');toast('Selesai. Cek kolom Audit SEO')}catch(e){toast(e.message)}}
async function bbulk(a){const slugs=[...bchk];if(!slugs.length){toast('Centang artikel dulu');return}
 if(a==='hapus'&&!confirm('Hapus '+slugs.length+' artikel? Tidak bisa dikembalikan (ada di backup harian).'))return;
 if(a==='tayang'&&!confirm('Tayangkan '+slugs.length+' artikel sekarang juga?'))return;
 try{const r=await api('/api/admin/posts/bulk','POST',{action:a,slugs,start:$('bstart').value,everyDays:+$('bgap').value||0});B=r.list;bchk=new Set();blogv();if(r.skipped&&r.skipped.length){$('bres').innerHTML=r.skipped.map(x=>`<div class="text-red-600">✗ ${E(x.slug)} — ${E(x.msg)}</div>`).join('');toast(r.skipped.length+' artikel ditahan karena belum lolos audit')}else toast(a==='jadwal'?'Terjadwal ✓':a==='tayang'?'Tayang ✓':a==='hapus'?'Terhapus':'Jadi draf ✓')}catch(e){toast(e.message)}}
function bnew(){bsel={old:'',title:'',mtitle:'',keyword:'',slug:'',cat:'Prompt Foto',descr:'',tags:'',cover:'',body:'',cta_t:'',cta_u:'',status:'draft',pub_wib:''};blogv()}
function bopen(s){bsel=Object.assign({},B.find(r=>r.slug===s),{old:s});blogv()}
function bedit(){const p=bsel,f=(k,l,ph,cls)=>`<div class="${cls||''}"><span class="lbl">${l}</span><input class="inp" value="${E(p[k])}" placeholder="${ph||''}" oninput="bsel.${k}=this.value"></div>`;
 $('view').innerHTML=head(p.old?'Ubah artikel':'Artikel baru','Isi bisa diubah bebas. Alamat artikel dibuat dari judul kalau dikosongkan.',`<button class="btn2" onclick="bsel=null;blogv()">← Kembali</button>`)
 +`<div class="grid md:grid-cols-2 gap-4"><div class="card p-5 space-y-3">${f('keyword','Kata kunci utama','mis. cara menulis prompt foto ai')}${f('title','Judul (H1) · harus memuat kata kunci persis','Judul artikel')}${f('mtitle','Judul untuk Google (meta_title, maks. 46 karakter)','memuat kata kunci persis')}${f('slug','Alamat (slug)','otomatis dari judul')}${f('cat','Kategori','Prompt Foto / Storyboard / Video AI / Tips Jualan')}<div><span class="lbl">Deskripsi untuk Google (120–155 karakter, memuat kata kunci)</span><textarea class="inp" rows="3" oninput="bsel.descr=this.value">${E(p.descr)}</textarea></div>${f('tags','Tag (pisahkan koma)','prompt foto, ai')}</div>
 <div class="card p-5 space-y-3"><div><span class="lbl">Gambar sampul (opsional)</span><div class="flex items-center gap-3">${p.cover?`<img src="${E(p.cover)}" class="w-24 h-16 rounded-lg object-cover">`:'<div class="w-24 h-16 rounded-lg bg-zinc-100 text-xs text-zinc-400 flex items-center justify-center">otomatis</div>'}<input id="bcv" type="file" accept="image/*" class="hidden" onchange="bcover(this.files[0])"><button class="btn2" onclick="$('bcv').click()">Unggah</button>${p.cover?'<button class="btn2" onclick="bsel.cover=\'\';blogv()">Hapus</button>':''}</div></div>${f('cta_t','Teks tombol di akhir artikel','Lihat Prompt Foto')}${f('cta_u','Tautan tombol','/#prompt-foto')}
 <div><span class="lbl">Jam tayang (WIB)</span><input type="datetime-local" class="inp" value="${E(p.pub_wib||wibNow(1))}" oninput="bsel.pub_wib=this.value"></div></div></div>
 <div class="card p-5 mt-4"><span class="lbl">Isi artikel (Markdown: ## judul bagian, - daftar, **tebal**, [teks](tautan))</span><textarea class="inp mono" style="font-family:'JetBrains Mono',monospace;font-size:13px" rows="18" oninput="bsel.body=this.value">${E(p.body)}</textarea>
 <div class="flex flex-wrap gap-2 pt-3 mt-3 border-t border-zinc-100"><button class="btn" onclick="bsave('jadwal')">Simpan &amp; jadwalkan</button><button class="btn2" onclick="bsave('tayang')">Tayangkan sekarang</button><button class="btn2" onclick="bsave('draft')">Simpan sebagai draf</button><button class="btn2" onclick="bsave('')">Simpan tanpa ubah status</button></div></div>`+bpanel(p.audit)}
async function bcover(f){try{bsel.cover=await shrink(f);blogv();toast('Sampul terunggah ✓')}catch(e){toast(e.message)}}
async function bsave(a){try{const r=await api('/api/admin/posts/save','POST',Object.assign({},bsel,{action:a,pub_wib:bsel.pub_wib||wibNow(1)}));B=r.list;bsel=null;blogv();toast(r.note||'Tersimpan ✓')}catch(e){try{B=await api('/api/admin/posts');bsel=Object.assign({},B.find(x=>x.slug===(bsel.slug||''))||bsel,{old:bsel.old||bsel.slug});blogv()}catch(_){}toast(e.message)}}

</script></body></html>
